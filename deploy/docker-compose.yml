# Mamahuhu self-hosting stack: app + OCR sidecar.
# Docs: deploy/README.md — copy .env.example to .env first.
services:
  mamahuhu:
    # Released image (tags track repo releases; see README).
    image: ghcr.io/lenaxia/mamahuhu:0.11.11
    # Fallback: build from source instead — uncomment and run:
    #   docker compose -f deploy/docker-compose.yml build
    # build:
    #   context: ..
    #   dockerfile: Dockerfile
    ports:
      - "8787:8787"
    env_file: .env
    environment:
      # OCR wiring — prewired to the sidecar service below; leave as-is.
      OCR_LADDER: "1"
      OCR_FUSION: "1"
      OCR_PIPELINE: "2"
      OCR_DET_URL: http://mamahuhu-ocr:8000/det
      OCR_HTTP_URL: http://mamahuhu-ocr:8000
      DATA_DIR: /data
    volumes:
      # sqlite DB + photos + audio cache — back this up.
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      mamahuhu-ocr:
        condition: service_healthy

  mamahuhu-ocr:
    # Default: build the sidecar from the repo (rapidocr + FastAPI, ~1GB image).
    # CI also publishes ghcr.io/lenaxia/mamahuhu-ocr but only as :latest / commit-sha
    # tags (no release tags) — to pull instead of building, comment out build:
    # and uncomment image:.
    build:
      context: ..
      dockerfile: Dockerfile.ocr
    # image: ghcr.io/lenaxia/mamahuhu-ocr:latest
    # Internal only — no ports published; the app reaches it on the compose network.
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
